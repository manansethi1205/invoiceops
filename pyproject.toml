[project]
name = "invoiceops"
version = "0.1.0"
description = "Evidence-first accounts-payable document processing"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "pymupdf>=1.26,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "invoiceops", "workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: black-box tests that require the Docker Compose stack"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["work", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["invoiceops.extraction.preprocessing"]
disallow_untyped_calls = false
