services:
  api:
    image: invoiceops-app:local
    pull_policy: never
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --no-access-log
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://invoiceops:invoiceops@postgres:5432/invoiceops
      S3_ENDPOINT_URL: http://object-storage:9090
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      object-storage: {condition: service_healthy}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    image: invoiceops-app:local
    pull_policy: never
    command: celery -A workers.extraction.celery_app:celery_app worker --loglevel=INFO --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://invoiceops:invoiceops@postgres:5432/invoiceops
      S3_ENDPOINT_URL: http://object-storage:9090
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      object-storage: {condition: service_healthy}

  worker-hybrid-fake:
    profiles: ["hybrid-test"]
    image: invoiceops-app:local
    pull_policy: never
    command: celery -A workers.extraction.celery_app:celery_app worker --loglevel=INFO --concurrency=2
    env_file: .env
    environment:
      S3_ENDPOINT_URL: http://object-storage:9090
      VLM_ENABLED: "true"
      VLM_PROVIDER: fake
      VLM_MODEL: fake-vision
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      object-storage: {condition: service_healthy}

  migrate:
    image: invoiceops-app:local
    pull_policy: never
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://invoiceops:invoiceops@postgres:5432/invoiceops
    depends_on:
      postgres: {condition: service_healthy}

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: invoiceops
      POSTGRES_USER: invoiceops
      POSTGRES_PASSWORD: invoiceops
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-storage:
    # S3-compatible local test storage. It is not a production object store.
    image: adobe/s3mock:5.1.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: invoice-documents
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /containers3root
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports: ["127.0.0.1:9000:9090"]
    volumes: ["object-storage-data:/containers3root"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  integration-tests:
    profiles: ["test"]
    image: invoiceops-tests:local
    pull_policy: never
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        INSTALL_DEV: "true"
    command: pytest -q -m docker tests/docker
    environment:
      API_BASE_URL: http://api:8000
      TEST_DATABASE_URL: postgresql+psycopg://invoiceops:invoiceops@postgres:5432/invoiceops
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_started}

  integration-tests-hybrid:
    profiles: ["hybrid-test"]
    image: invoiceops-tests:local
    pull_policy: never
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        INSTALL_DEV: "true"
    command: pytest -q -m docker tests/docker
    environment:
      API_BASE_URL: http://api:8000
      EXPECT_EXTRACTION_STRATEGY: hybrid-routed
      TEST_DATABASE_URL: postgresql+psycopg://invoiceops:invoiceops@postgres:5432/invoiceops
    depends_on:
      api: {condition: service_healthy}
      worker-hybrid-fake: {condition: service_started}

  evaluator:
    profiles: ["evaluation"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        INSTALL_EVALUATION: "true"
    environment:
      INVOICEOPS_EVALUATION_RUNTIME: docker
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
    volumes:
      - ./evals:/app/evals
      - type: bind
        source: ${DOCILE_DATASET_PATH:-./data/docile}
        target: /data/docile
        read_only: true
    entrypoint: ["python", "-m", "invoiceops.evaluation"]

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./infrastructure/observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      tempo: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yml"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./infrastructure/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    healthcheck:
      # The pinned Tempo image is distroless, so it cannot call its own HTTP readiness endpoint.
      test: ["CMD", "/tempo", "-version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      otel-collector: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus: {condition: service_healthy}
      tempo: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  observability-tests:
    profiles: ["observability"]
    image: invoiceops-tests:local
    pull_policy: never
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        INSTALL_DEV: "true"
    command: pytest -q tests/docker/test_observability_stack.py
    environment:
      API_BASE_URL: http://api:8000
      PROMETHEUS_URL: http://prometheus:9090
      TEMPO_URL: http://tempo:3200
      GRAFANA_URL: http://grafana:3000
      OBSERVABILITY_STACK_ENABLED: ${OTEL_ENABLED:-false}
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_started}
      otel-collector: {condition: service_healthy}
      prometheus: {condition: service_healthy}
      tempo: {condition: service_healthy}
      grafana: {condition: service_healthy}

volumes:
  postgres-data:
  object-storage-data:
  tempo-data:
  prometheus-data:
  grafana-data:
