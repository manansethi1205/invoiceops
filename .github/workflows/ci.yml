name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  quality-tests-evaluation:
    name: Quality, Tests & Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Dependency and repository hygiene
        shell: bash
        run: |
          uv lock --check
          if [ -n "$(git ls-files tmp)" ]; then
            echo "Tracked temporary artifacts detected under tmp/"
            git ls-files tmp
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$'; then
            echo "Tracked credential-like file detected"
            exit 1
          fi
          if git ls-files | grep -E '(kile_predictions|lir_predictions|official_.*_result)\.json$'; then
            echo "Tracked raw DocILE evaluation artifact detected"
            exit 1
          fi
          unexpected_docile=$(git ls-files data/docile | grep -vE '^data/docile/manifests/[^/]+\.json$' || true)
          if [ -n "$unexpected_docile" ]; then
            echo "Tracked DocILE content outside ID-only manifests detected"
            echo "$unexpected_docile"
            exit 1
          fi
          if git grep -nE 'C:\\Users\\|/Users/|/home/|sk-[A-Za-z0-9_-]{16,}' -- \
            ':!.github/workflows/ci.yml'; then
            echo "Tracked local path or credential-like token detected"
            exit 1
          fi

      - name: Markdown UTF-8 and mojibake check
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          markdown_files = subprocess.check_output(
              ["git", "ls-files", "*.md"], text=True
          ).splitlines()
          mojibake = [
              "".join(chr(value) for value in (0xE2, 0x20AC, 0x201D)),
              "".join(chr(value) for value in (0xC3, 0x2014)),
              "".join(chr(value) for value in (0xEF, 0xBF, 0xBD)),
              chr(0xFFFD),
          ]
          failures = []
          for filename in markdown_files:
              try:
                  text = Path(filename).read_text(encoding="utf-8", errors="strict")
              except UnicodeDecodeError as exc:
                  failures.append(f"{filename}: invalid UTF-8 ({exc})")
                  continue
              for marker in mojibake:
                  if marker in text:
                      failures.append(f"{filename}: contains mojibake {marker!r}")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Validated {len(markdown_files)} Markdown files as clean UTF-8")

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy apps invoiceops workers

      - name: Validate observability configuration
        run: |
          cp .env.example .env
          docker compose --profile observability config --quiet
          python -m json.tool \
            infrastructure/observability/grafana/dashboards/invoiceops-operations.json \
            >/dev/null
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/infrastructure/observability:/etc/invoiceops-observability:ro" \
            quay.io/prometheus/prometheus:v3.5.0 \
            check rules /etc/invoiceops-observability/prometheus-rules.yml
          docker run --rm \
            -v "$PWD/infrastructure/observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro" \
            ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.135.0 \
            validate --config=/etc/otelcol-contrib/config.yml

      - name: Pytest
        run: uv run pytest -m "not docker and not docile"

      - name: Run supporting-document evaluation
        run: |
          mkdir -p "$RUNNER_TEMP/supporting-evaluation"
          uv run python scripts/run_supporting_evaluation.py \
            --output-dir "$RUNNER_TEMP/supporting-evaluation"

      - name: Run supporting-model replay safety evaluation
        run: |
          uv run python scripts/run_supporting_hybrid_evaluation.py \
            --output "$RUNNER_TEMP/supporting-hybrid-replay.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "supporting-hybrid-replay.json").read_text()
          )
          if report["false_canonical_record_count"] != 0:
              raise SystemExit("Supporting replay created a canonical record")
          if report["confirmation_rate"] is not None:
              raise SystemExit("Replay must not claim measured human confirmations")
          print("Supporting replay safety invariants passed")
          PY

      - name: Assert no false canonical records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("${{ runner.temp }}/supporting-evaluation/report.json").read_text()
          )
          count = report["system"]["false_canonical_record_count"]
          if count != 0:
              raise SystemExit(f"CI invariant failed: false_canonical_record_count={count}")
          print("PASS: false_canonical_record_count == 0")
          PY

      - name: Run matching evaluation
        run: |
          mkdir -p "$RUNNER_TEMP/matching-evaluation"
          uv run python scripts/run_matching_evaluation.py \
            --output-dir "$RUNNER_TEMP/matching-evaluation"

      - name: Assert matching evaluation invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          report = Path(
              "${{ runner.temp }}/matching-evaluation/report.md"
          ).read_text(encoding="utf-8")

          match = re.search(
              r"False auto-match count:\s*(\d+)",
              report,
          )

          if match is None:
              raise SystemExit(
                  "Could not find 'False auto-match count' in matching evaluation report"
              )

          false_auto_match_count = int(match.group(1))

          if false_auto_match_count != 0:
              raise SystemExit(
                  f"CI invariant failed: false_auto_match_count={false_auto_match_count}"
              )

          print("PASS: false_auto_match_count == 0")
          PY

      - name: Run hybrid evaluation
        run: |
          # The report writer creates this leaf directory and refuses existing outputs.
          uv run python scripts/run_hybrid_evaluation.py \
            --mode hybrid-replay \
            --output-dir "$RUNNER_TEMP/hybrid-evaluation"

      - name: Assert hybrid evaluation invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path(
              "${{ runner.temp }}/hybrid-evaluation/report.json"
          )

          report = json.loads(report_path.read_text(encoding="utf-8"))

          safety = report["safety"]

          assertions = {
              "no_ungrounded_candidate_promoted":
                  safety["no_ungrounded_candidate_promoted"],
              "all_grounded_disagreements_abstained":
                  safety["all_grounded_disagreements_abstained"],
              "schema_valid_rate":
                  report["hybrid_replay"]["schema_valid_rate"] == 1.0,
          }

          for name, passed in assertions.items():
              if not passed:
                  raise SystemExit(
                      f"CI invariant failed: {name} != required value"
                  )
              print(f"PASS: {name}")

          print("All hybrid evaluation invariants passed.")
          PY

      - name: Run row-association safety evaluation
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path
          from invoiceops.evaluation.row_alignment import write_stress

          output = Path(os.environ["RUNNER_TEMP"]) / "row-alignment-evaluation"
          write_stress(output)
          report = json.loads((output / "report.json").read_text())
          if report["associated"] == 0 or report["association_precision"] != 1.0:
              raise SystemExit("Row association precision gate failed")
          if report["cross_row_promotions"] != 0 or report["false_automatic_matches"] != 0:
              raise SystemExit("Unsafe row promotion or automatic match")
          if report["review_cases"] != report["expected_review_cases"]:
              raise SystemExit("Row association review accounting failed")
          print("Row association safety invariants passed")
          PY

      - name: Run review workflow evaluation
        run: |
          mkdir -p "$RUNNER_TEMP/review-evaluation"
          uv run python scripts/run_review_evaluation.py \
            --output-dir "$RUNNER_TEMP/review-evaluation"

      - name: Assert review workflow safety invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("${{ runner.temp }}/review-evaluation/report.json").read_text()
          )
          required_one = [
              "expected_transition_accuracy",
              "allowed_transition_accuracy",
              "invalid_transition_rejection_rate",
              "stale_version_rejection_accuracy",
              "unauthorized_owner_action_rejection_rate",
              "idempotent_replay_rejection_accuracy",
              "event_chain_verification_rate",
              "state_reconstruction_accuracy",
          ]
          for metric in required_one:
              if report[metric] != 1.0:
                  raise SystemExit(f"CI invariant failed: {metric}={report[metric]}")
          if report["false_auto_resolution_count"] != 0:
              raise SystemExit("CI invariant failed: false automatic review resolution")
          if report["duplicate_case_count"] != 0:
              raise SystemExit("CI invariant failed: duplicate review cases")
          print("All review workflow invariants passed.")
          PY

      - name: Run duplicate-risk evaluation
        run: |
          mkdir -p "$RUNNER_TEMP/duplicate-risk-evaluation"
          uv run python scripts/run_duplicate_risk_evaluation.py \
            --output-dir "$RUNNER_TEMP/duplicate-risk-evaluation"

      - name: Assert duplicate-risk safety invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("${{ runner.temp }}/duplicate-risk-evaluation/report.json").read_text()
          )
          if report["known_duplicate_false_clear_count"] != 0:
              raise SystemExit("CI invariant failed: a known duplicate was cleared")
          if report["duplicate_assessment_count"] != 0:
              raise SystemExit("CI invariant failed: duplicate assessments were produced")
          print("All duplicate-risk safety invariants passed.")
          PY

      - name: Run three-way matching evaluation
        run: |
          mkdir -p "$RUNNER_TEMP/three-way-evaluation"
          uv run python scripts/run_three_way_evaluation.py \
            --output-dir "$RUNNER_TEMP/three-way-evaluation"

      - name: Assert three-way matching safety invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("${{ runner.temp }}/three-way-evaluation/report.json").read_text()
          )
          if report["scenario_count"] < 25:
              raise SystemExit("CI invariant failed: fewer than 25 scenarios")
          if report["false_auto_match_count"] != 0:
              raise SystemExit("CI invariant failed: false automatic three-way match")
          if report["allocation_on_review_count"] != 0:
              raise SystemExit("CI invariant failed: allocation created for review outcome")
          for metric in (
              "allocation_correctness_rate",
              "cumulative_overbilling_detection_rate",
              "serialized_overbilling_scenario_accuracy",
          ):
              if report[metric] != 1.0:
                  raise SystemExit(f"CI invariant failed: {metric}={report[metric]}")
          print("All three-way matching safety invariants passed.")
          PY

  supporting-document-holdout:
    name: Generated supporting PDF/PNG holdout
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure synthetic environment
        run: cp .env.example .env

      - name: Build Tesseract-equipped evaluator
        env:
          COMPOSE_BAKE: "false"
        run: docker compose --profile evaluation build evaluator

      - name: Evaluate known regression set and untouched layout family
        run: |
          mkdir -p "$RUNNER_TEMP/supporting-ci"
          chmod 777 "$RUNNER_TEMP/supporting-ci"
          docker compose --profile evaluation run --rm \
            --volume "$RUNNER_TEMP/supporting-ci:/app/work" \
            --entrypoint python evaluator \
            scripts/run_supporting_document_holdout.py \
            --output /app/work/known.json
          docker compose --profile evaluation run --rm \
            --volume "$RUNNER_TEMP/supporting-ci:/app/work" \
            --entrypoint python evaluator \
            scripts/run_supporting_document_holdout.py --unseen \
            --output /app/work/unseen.json

      - name: Assert coverage, identifier regressions and safety
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          reports = Path("evals/reports")
          outputs = Path(os.environ["RUNNER_TEMP"]) / "supporting-ci"
          known = json.loads((outputs / "known.json").read_text())
          unseen = json.loads((outputs / "unseen.json").read_text())
          before = json.loads((reports / "supporting-documents-v1-docker.json").read_text())
          if known["fingerprint"] != before["fingerprint"]:
              raise SystemExit("Known regression dataset fingerprint changed")
          for name, report in (("known", known), ("unseen", unseen)):
              if report["evaluated_documents"] != report["holdout_documents"]:
                  raise SystemExit(f"{name}: incomplete document coverage")
              if report["failure_categories"]:
                  raise SystemExit(f"{name}: document failures: {report['failure_categories']}")
              if report["source_counts"].get("image/png", 0) == 0:
                  raise SystemExit(f"{name}: no OCR images evaluated")
              if report["comparison"]["false_canonical_record_count"] != 0:
                  raise SystemExit(f"{name}: canonical record safety failure")
          counts = known["comparison"]["deterministic"]
          if counts["PURCHASE_ORDER"]["header_exact_counts"]["po_number"] != 10:
              raise SystemExit("Known PO number regression failed")
          for role in ("GOODS_RECEIPT", "DELIVERY_NOTE"):
              if counts[role]["header_exact_counts"]["referenced_po_number"] != 10:
                  raise SystemExit(f"Known {role} PO-reference regression failed")
          for role in counts:
              prior = before["comparison"]["deterministic"][role]["line_item_f1"]
              current = counts[role]["line_item_f1"]
              if current < prior:
                  raise SystemExit(f"Known {role} line-item F1 regressed: {current} < {prior}")
          print("Generated-document coverage, identifier and safety gates passed")
          PY

      - name: Upload aggregate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supporting-document-holdout
          path: ${{ runner.temp }}/supporting-ci/*.json
          if-no-files-found: ignore

  migrations:
    name: PostgreSQL Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: invoiceops
          POSTGRES_PASSWORD: invoiceops
          POSTGRES_DB: invoiceops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoiceops -d invoiceops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://invoiceops:invoiceops@localhost:5432/invoiceops
        run: uv run alembic upgrade head

  web-quality:
    name: Web Type, Unit, Accessibility & Visual
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for OpenAPI export
        uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Verify generated API contract
        run: |
          uv run python scripts/export_openapi.py
          pnpm --dir web openapi
          git diff --exit-code -- web/openapi.json web/src/lib/api/schema.d.ts

      - name: Typecheck, lint and unit test
        working-directory: web
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser, accessibility and visual tests
        working-directory: web
        run: pnpm test:e2e

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

  compose-integration:
    name: Docker Compose Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure environment
        run: cp .env.example .env

      - name: Run real-stack integration tests
        env:
          COMPOSE_PARALLEL_LIMIT: "1"
          COMPOSE_BAKE: "false"
        run: |
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              echo "Attempt $attempt failed; retrying in $((attempt * 10)) seconds"
              sleep $((attempt * 10))
            done
          }
          retry docker compose build api
          retry docker compose build web
          retry docker compose --profile test build integration-tests
          docker compose up --no-build -d --wait --wait-timeout 180 api worker
          docker compose --profile test run --rm --no-deps integration-tests
          docker compose up --no-build -d --wait --wait-timeout 180 web
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:3000/login >/dev/null
          cookie_jar="${RUNNER_TEMP}/invoiceops-web.cookies"
          curl --fail --silent --show-error \
            --cookie-jar "$cookie_jar" \
            --data "role=operator" \
            http://127.0.0.1:3000/api/auth/dev-login >/dev/null
          curl --fail --retry 5 --retry-delay 2 \
            --cookie "$cookie_jar" \
            http://127.0.0.1:3000/api/backend/health/ready >/dev/null

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs web api worker migrate postgres redis object-storage

      - name: Tear down stack
        if: always()
        run: docker compose --profile test down --volumes

  compose-observability:
    name: Docker Compose Telemetry Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure synthetic local environment
        run: cp .env.example .env

      - name: Run telemetry smoke test
        env:
          OTEL_ENABLED: "true"
          COMPOSE_PARALLEL_LIMIT: "1"
          COMPOSE_BAKE: "false"
        run: |
          docker compose --profile observability build api
          docker compose --profile observability build observability-tests
          docker compose --profile observability up --no-build -d --wait --wait-timeout 180 \
            api worker otel-collector tempo prometheus grafana
          docker compose --profile observability run --rm --no-deps observability-tests

      - name: Show telemetry logs on failure
        if: failure()
        run: docker compose logs api worker otel-collector tempo prometheus grafana

      - name: Tear down stack
        if: always()
        run: docker compose --profile observability down --volumes
